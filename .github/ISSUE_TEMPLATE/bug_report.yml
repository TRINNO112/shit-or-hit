name: Bug Report
description: Report a bug, broken UI state, or runtime error in SHIT OR HIT
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first to avoid duplicates.
        For security vulnerabilities, please refer to our [Security Policy](../../SECURITY.md) instead of creating a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Open the app at '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Screenshots
      description: What actually occurred? Drag and drop screenshots or paste error logs here.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Browser & Operating System
      description: Which browser and OS did you experience this on?
      options:
        - Chrome / Windows
        - Chrome / macOS
        - Chrome / Android
        - Safari / iOS
        - Safari / macOS
        - Firefox / Any
        - Edge / Windows
        - Other (specify in description)
    validations:
      required: true

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I verified that this bug is reproducible in the latest version of `main`.
          required: true
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
