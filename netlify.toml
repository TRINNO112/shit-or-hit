[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:frontend"
  port = 8888
  targetPort = 5888
  publish = "dist"

[[redirects]]
  from = "/architecture-flowchart.html"
  to = "/architecture-flowchart.html"
  status = 200

[[redirects]]
  from = "/daily-verdict-flowchart-v8.html"
  to = "/daily-verdict-flowchart-v8.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/architecture-flowchart.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/daily-verdict-flowchart-v8.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Type = "text/html; charset=utf-8"
