const D=[
['n1',300,380,'u','c','Sit down at night','Phone or laptop, end of day.','One quiet minute, no setup.','moon',
 'You open the app on your phone, laptop, or as an installed home-screen app. Small screens get a 4-tab view, big screens get a full dashboard. A guest space opens instantly, no sign-up wall.',

['n2',1000,380,'u','y','Give the day a verdict','Rough, Down, Okay, Good, Peak.','One tap. One honest second.','star',

['n3',1700,380,'u','m','Check your life spheres','Work, home, social, habits.','Blended into one fair score.','sphere',

['n4',2400,380,'ai','l','Write, AI polishes','Dump your messy thoughts.','AI writes it up in your voice.','spark',

['n5',3100,380,'ai','l','Your mascot answers','Mascot + quote react to you.','Two rough days? Gentle reset.','face',

['n6',3100,1260,'u','c','Saved before you blink','Optimistic save in ~1 ms.','Works with zero internet.','disk',

['n7',2400,1260,'u','r','Make it a poster','Daily story or square card.','Shareable aesthetic card.','poster',

['n8',1700,1260,'u','m','Look back at your days','Month grid, week, timeline.','Tap any day to fix it.','cal',

['n9',1000,1260,'u','y','See your patterns','Streak, hit rate, weekdays.','Spot your cursed Thursdays.','chart',

['n10',300,1260,'ai','l','A letter from a friend','AI reads your whole month.','Letter + 6 sharp insights.','mail',

['n11',1700,1800,'u','m','A steadier you','Honest logs, month by month.','Habits evolve. See you tonight.','loop',
 'Weeks of small honest check-ins add up. You learn your triggers, protect your good days, and recover faster from bad ones. Then tomorrow night, you sit down again.',

['f1',3100,2480,'f','c','Local-first storage','Diary lives on your device.','Private slot for each user.','disk',

['a4',2400,3950,'ai','c','Time-lock capsule','Past you writes to future you.','Unlocked only in a slump.','lock',
